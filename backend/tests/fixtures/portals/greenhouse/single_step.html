<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Software Engineer - Greenhouse Job Application</title>
</head>
<body>
    <div id="app">
        <h1>Acme Corp - Senior Backend Engineer</h1>
        <form id="application_form" action="https://boards.greenhouse.io/acme/jobs/12345/apply" method="POST" enctype="multipart/form-data">
            <div class="field">
                <label for="first_name">First Name *</label>
                <input type="text" id="first_name" name="first_name" required="required" autocomplete="given-name" />
            </div>
            <div class="field">
                <label for="last_name">Last Name *</label>
                <input type="text" id="last_name" name="last_name" required="required" autocomplete="family-name" />
            </div>
            <div class="field">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required="required" autocomplete="email" />
            </div>
            <div class="field">
                <label for="phone">Phone *</label>
                <input type="tel" id="phone" name="phone" required="required" autocomplete="tel" />
            </div>
            <div class="field">
                <label for="resume">Resume/CV *</label>
                <input type="file" id="resume" name="resume" required="required" accept=".pdf,.doc,.docx" />
            </div>
            <div class="field">
                <label for="job_application_answers_attributes_0_boolean_value">Are you legally authorized to work in the United States? *</label>
                <select id="job_application_answers_attributes_0_boolean_value" name="job_application[answers_attributes][0][boolean_value]" required="required">
                    <option value="">-- Please select --</option>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>
            <div class="actions">
                <input type="submit" id="submit_app" value="Submit Application" />
            </div>
        </form>
    </div>
</body>
</html>
