<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stripe - Backend Engineer - Lever</title>
</head>
<body>
    <div class="application-page">
        <form id="application-form" class="application-form" action="https://jobs.lever.co/stripe/apply" method="POST">
            <div class="section page-centered application-form">
                <h4>Submit your application</h4>
                <div class="application-question">
                    <label>Resume/CV ✱</label>
                    <input type="file" name="resume" class="visible-resume-upload" required />
                </div>
                <div class="application-question">
                    <label>Full name ✱</label>
                    <input type="text" name="name" required />
                </div>
                <div class="application-question">
                    <label>Email ✱</label>
                    <input type="email" name="email" required />
                </div>
                <div class="application-question">
                    <label>Phone</label>
                    <input type="tel" name="phone" />
                </div>
                <div class="application-question">
                    <label>Current company</label>
                    <input type="text" name="org" />
                </div>
                <div class="application-question">
                    <label>LinkedIn URL</label>
                    <input type="url" name="urls[LinkedIn]" />
                </div>
                <div class="application-question">
                    <label>GitHub URL</label>
                    <input type="url" name="urls[GitHub]" />
                </div>
            </div>
            <div class="actions">
                <button type="submit" id="btn-submit" class="template-btn-submit">Submit application</button>
            </div>
        </form>
    </div>
</body>
</html>
