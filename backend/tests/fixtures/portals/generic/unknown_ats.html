<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Careers - Custom Portal Application</title>
</head>
<body>
    <div class="custom-portal">
        <h2>Apply for this position</h2>
        <form id="career_app" action="/careers/submit" method="POST">
            <div class="form-group">
                <label for="c_name">Full Name</label>
                <input type="text" id="c_name" name="name" required />
            </div>
            <div class="form-group">
                <label for="c_email">Email</label>
                <input type="email" id="c_email" name="email" required />
            </div>
            <div class="form-group">
                <label for="c_resume">Resume</label>
                <input type="file" id="c_resume" name="resume" required />
            </div>
            <button type="submit" class="submit-btn">Apply Now</button>
        </form>
    </div>
</body>
</html>
